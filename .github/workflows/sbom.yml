name: SBOM and supply-chain metadata

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BackendSafetyKit.slnx

      - name: Build
        run: dotnet build BackendSafetyKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BackendSafetyKit.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack BackendSafetyKit.slnx --configuration Release --no-build --output ./artifacts

      - name: Validate packages
        run: python scripts/validate_nuget_packages.py ./artifacts

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./artifacts
          format: cyclonedx-json
          output-file: ./artifacts/backend-safety-kit.sbom.json
          upload-artifact: true
          artifact-name: backend-safety-kit-sbom
