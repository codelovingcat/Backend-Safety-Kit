name: Semantic version policy

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.csproj"
      - "scripts/check_package_versions.py"
      - "scripts/tests/test_check_package_versions.py"
      - "docs/versioning-policy.md"
      - ".github/workflows/version-policy.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify shipping package versions
        run: python scripts/check_package_versions.py

      - name: Test version policy
        run: python -m unittest discover -s scripts/tests -p "test_check_package_versions.py" -v
