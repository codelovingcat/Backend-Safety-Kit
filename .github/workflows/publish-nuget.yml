name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'codelovingcat/Backend-Safety-Kit'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    environment: nuget-production
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      VERSION_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION_TAG" != v* ]]; then
            echo "Release tags must start with v." >&2
            exit 1
          fi
          python scripts/check_package_versions.py --tag "$VERSION_TAG"
          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "Configure the NUGET_API_KEY secret in the nuget-production environment." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore BackendSafetyKit.slnx

      - name: Build
        run: dotnet build BackendSafetyKit.slnx --configuration Release --no-restore

      - name: Test
        env:
          REDIS_CONNECTION: localhost:6379,abortConnect=false,connectTimeout=3000,asyncTimeout=3000
        run: dotnet test BackendSafetyKit.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack BackendSafetyKit.slnx --configuration Release --no-build --output ./artifacts

      - name: Validate NuGet artifacts
        run: python scripts/validate_nuget_packages.py ./artifacts

      - name: Set up Python for SBOM validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SBOM schema validator and fetch the official schema
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r scripts/requirements-sbom.txt
          curl --fail --silent --show-error --location \
            https://cyclonedx.org/schema/bom-1.6.schema.json \
            --output "$RUNNER_TEMP/cyclonedx-bom-1.6.schema.json"

      - name: Generate and validate dependency-complete CycloneDX SBOM
        run: >-
          python scripts/generate_release_sbom.py ./artifacts
          --schema "$RUNNER_TEMP/cyclonedx-bom-1.6.schema.json"

      - name: Generate and verify artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd ./artifacts
          sha256sum ./*.nupkg ./*.snupkg ./backend-safety-kit.sbom.json > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload SBOM and checksums
        uses: actions/upload-artifact@v4
        with:
          name: backend-safety-kit-release-sbom-and-checksums
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/backend-safety-kit.sbom.json
            ./artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ./artifacts/*

      - name: Publish packages and symbols
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            echo "Publishing $(basename "$package")"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
