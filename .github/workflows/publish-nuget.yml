name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'codelovingcat/Backend-Safety-Kit'
    runs-on: ubuntu-latest
    environment: nuget-production
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      VERSION_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION_TAG" != v* ]]; then
            echo "Release tags must start with v." >&2
            exit 1
          fi
          python scripts/check_package_versions.py --tag "$VERSION_TAG"
          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "Configure the NUGET_API_KEY secret in the nuget-production environment." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore BackendSafetyKit.slnx

      - name: Build
        run: dotnet build BackendSafetyKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BackendSafetyKit.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack BackendSafetyKit.slnx --configuration Release --no-build --output ./artifacts

      - name: Validate NuGet artifacts
        run: python scripts/validate_nuget_packages.py ./artifacts

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./artifacts
          format: cyclonedx-json
          output-file: ./artifacts/backend-safety-kit.sbom.json
          upload-artifact: true
          artifact-name: backend-safety-kit-release-sbom

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ./artifacts/*

      - name: Publish packages and symbols
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            echo "Publishing $(basename "$package")"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
