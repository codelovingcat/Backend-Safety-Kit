name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'codelovingcat/Backend-Safety-Kit'
    runs-on: ubuntu-latest
    environment: nuget-production
    permissions:
      contents: read
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      VERSION_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION_TAG" != v* ]]; then
            echo "Release tags must start with v." >&2
            exit 1
          fi
          version="${VERSION_TAG#v}"
          python - "$version" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          semver = re.compile(
              r"^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)"
              r"(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$"
          )

          expected = {
              "BackendSafetyKit": "src/BackendSafetyKit/BackendSafetyKit.csproj",
              "BackendSafetyKit.AspNetCore": "src/BackendSafetyKit.AspNetCore/BackendSafetyKit.AspNetCore.csproj",
              "BackendSafetyKit.OpenTelemetry": "src/BackendSafetyKit.OpenTelemetry/BackendSafetyKit.OpenTelemetry.csproj",
          }
          version = sys.argv[1]
          if not semver.fullmatch(version):
              raise SystemExit(f"Release version {version!r} is not valid SemVer 2.0.0")
          for package_id, name in expected.items():
              root = ET.parse(name).getroot()
              values = {
                  element.text.strip()
                  for element in root.iter()
                  if element.tag.rsplit("}", 1)[-1] == "Version" and element.text
              }
              ids = {
                  element.text.strip()
                  for element in root.iter()
                  if element.tag.rsplit("}", 1)[-1] == "PackageId" and element.text
              }
              if ids != {package_id} or values != {version}:
                  raise SystemExit(f"{name} must declare {package_id} version {version}; found ids={ids}, versions={values}")
          PY
          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "Configure the NUGET_API_KEY secret in the nuget-production environment." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore BackendSafetyKit.slnx

      - name: Build
        run: dotnet build BackendSafetyKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BackendSafetyKit.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack BackendSafetyKit.slnx --configuration Release --no-build --output ./artifacts

      - name: Validate NuGet artifacts
        run: python scripts/validate_nuget_packages.py ./artifacts

      - name: Publish packages and symbols
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            echo "Publishing $(basename "$package")"
            dotnet nuget push "$package"               --api-key "$NUGET_API_KEY"               --source https://api.nuget.org/v3/index.json               --skip-duplicate
          done
