name: Dependency vulnerability scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Restore dependencies
        run: dotnet restore BackendSafetyKit.slnx

      - name: Produce direct and transitive vulnerability report
        run: dotnet package list --project BackendSafetyKit.slnx --vulnerable --include-transitive --format json --output-version 1 --verbosity quiet > "$RUNNER_TEMP/dependency-report.json"

      - name: Fail when report includes known vulnerabilities
        run: python scripts/check_dotnet_vulnerabilities.py "$RUNNER_TEMP/dependency-report.json"

      - name: Test vulnerability report parser
        run: python -m unittest discover -s scripts/tests -p "test_check_dotnet_vulnerabilities.py" -v
