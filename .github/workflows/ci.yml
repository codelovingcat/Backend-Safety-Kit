name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BackendSafetyKit.slnx

      - name: Build
        run: dotnet build BackendSafetyKit.slnx --configuration Release --no-restore

      - name: API compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-api-compatibility.sh "$BASE_SHA"

      - name: Test
        env:
          REDIS_CONNECTION: localhost:6379,abortConnect=false,connectTimeout=3000,asyncTimeout=3000
        run: dotnet test BackendSafetyKit.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack BackendSafetyKit.slnx --configuration Release --no-build --output ./artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate NuGet packages
        run: python scripts/validate_nuget_packages.py ./artifacts

      - name: Test clean NuGet consumers
        run: python scripts/test_nuget_consumers.py ./artifacts
